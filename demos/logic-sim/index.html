<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Logic Sim · event-driven circuit simulator</title>
  <meta name="description" content="Drag gates onto a board, wire them up and watch signals propagate one gate delay at a time.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2307110c'/%3E%3Cpath d='M7 9h8a7 7 0 010 14H7z' fill='none' stroke='%23e0a458' stroke-width='2.5'/%3E%3Cpath d='M2 12h5M2 20h5M22 16h8' stroke='%233ee08f' stroke-width='2.5'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script>
    // Apply ?theme= before first paint to avoid a flash.
    (function () {
      var t = new URLSearchParams(location.search).get('theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    })();
  </script>
</head>
<body>
  <div class="app" id="app">
    <header class="toolbar" role="toolbar" aria-label="Simulator controls">
      <div class="brand" title="Logic Sim">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M7 9h8a7 7 0 010 14H7z" class="b-gate"/><path d="M2 12h5M2 20h5M22 16h8" class="b-sig"/></svg>
        <span>LOGIC<b>SIM</b></span>
      </div>

      <div class="tb-group">
        <label class="sr-only" for="example">Example circuit</label>
        <select id="example" title="Load an example circuit"><option value="">Examples…</option></select>
      </div>

      <div class="tb-group">
        <button id="run" class="primary" title="Run / pause the clock (Space)"><span class="ico">▶</span><span class="txt">Run</span></button>
        <button id="step" title="Advance one tick (→ or .)"><span class="ico">⏭</span><span class="txt">Step</span></button>
        <button id="settle" title="Run until stable (clocks held)"><span class="ico">⇥</span><span class="txt">Settle</span></button>
        <button id="reset" title="Reset time, flip-flops and clocks"><span class="ico">↺</span><span class="txt">Reset</span></button>
        <label class="speed" title="Simulation speed">
          <span class="sr-only">Speed</span>
          <select id="speed">
            <option value="2">2 t/s</option><option value="5">5 t/s</option><option value="10" selected>10 t/s</option>
            <option value="25">25 t/s</option><option value="60">60 t/s</option><option value="250">250 t/s</option>
          </select>
        </label>
      </div>

      <div class="tb-group">
        <button id="truth" title="Truth table, gate count and critical path"><span class="ico">▦</span><span class="txt">Truth table</span></button>
        <button id="timing" title="Timing diagram" aria-pressed="false"><span class="ico">⎍</span><span class="txt">Timing</span></button>
        <button id="package" title="Package this circuit as a reusable chip"><span class="ico">▣</span><span class="txt">Package chip</span></button>
      </div>

      <div class="tb-group tb-end">
        <button id="undo" class="icon" title="Undo (Ctrl+Z)">↶</button>
        <button id="redo" class="icon" title="Redo (Ctrl+Y)">↷</button>
        <button id="save" title="Download circuit JSON"><span class="ico">⤓</span><span class="txt">Save</span></button>
        <button id="load" title="Open a circuit JSON file"><span class="ico">⤒</span><span class="txt">Load</span></button>
        <button id="share" title="Copy a link containing this circuit"><span class="ico">↗</span><span class="txt">Share</span></button>
        <button id="theme" class="icon" title="Toggle light / dark">◐</button>
        <input type="file" id="file" accept=".json,application/json" hidden>
      </div>
    </header>

    <aside class="palette" id="palette" aria-label="Parts">
      <button class="sheet-handle" id="sheet-handle" aria-label="Show or hide parts"><span></span></button>
      <div class="parts" id="parts"></div>
      <div class="inspector" id="inspector"></div>
    </aside>

    <main class="board-wrap" id="board-wrap">
      <svg id="board" aria-label="Circuit board"></svg>
      <div class="banner" id="banner" role="status" hidden></div>
      <div class="armed-hint" id="armed-hint" hidden></div>
      <div class="desc" id="desc"></div>
      <footer class="status" id="status" aria-live="polite"></footer>
      <div class="zoom-ctl">
        <button class="icon" id="zoom-in" title="Zoom in">+</button>
        <button class="icon" id="zoom-out" title="Zoom out">−</button>
        <button class="icon" id="zoom-fit" title="Fit circuit (F)">⤢</button>
      </div>
    </main>

    <section class="timing-panel" id="timing-panel" hidden aria-label="Timing diagram">
      <div class="timing-head">
        <h2>Timing diagram</h2>
        <span class="muted">ticks →</span>
        <div class="spacer"></div>
        <button class="icon" data-zoom="out" title="Zoom out time">−</button>
        <button class="icon" data-zoom="in" title="Zoom in time">+</button>
        <button class="icon" id="timing-close" title="Close">✕</button>
      </div>
      <div class="timing-body">
        <div class="timing-signals"></div>
        <canvas></canvas>
      </div>
    </section>
  </div>

  <div class="modal" id="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <header><h2 id="modal-title"></h2><button class="icon" id="modal-close" title="Close (Esc)">✕</button></header>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <div class="ghost" id="ghost" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
